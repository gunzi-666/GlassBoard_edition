name: 构建并发布

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，格式 x.y.z（不带 v），例如 0.9.18'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = if ($env:EVENT -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME -replace '^v', '' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "版本号必须是 x.y.z 格式，当前为：$v"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 写入版本号
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $full = "$env:VERSION.0"
          $info = 'source/Properties/AssemblyInfo.cs'
          (Get-Content -Raw $info) -replace 'Assembly(File)?Version\("[^"]*"\)', ('Assembly$1Version("' + $full + '")') | Set-Content -NoNewline $info
          $manifest = 'source/app.manifest'
          (Get-Content -Raw $manifest) -replace '(<assemblyIdentity version=")[^"]*(")', ('${1}' + $full + '${2}') | Set-Content -NoNewline $manifest
          Select-String -Path $info, $manifest -Pattern $full

      - name: 编译
        run: |
          dotnet restore source/GlassBoard.csproj --source https://api.nuget.org/v3/index.json
          dotnet build source/GlassBoard.csproj -c Release --no-restore
          dotnet restore source/GlassBoard.Updater/GlassBoard.Updater.csproj --source https://api.nuget.org/v3/index.json
          dotnet build source/GlassBoard.Updater/GlassBoard.Updater.csproj -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: 打包
        id: pkg
        run: ./.github/scripts/package.ps1 -Version '${{ steps.ver.outputs.version }}' -Repository '${{ github.repository }}'

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: GlassBoard v${{ steps.ver.outputs.version }}
          body_path: Update.md
          draft: false
          prerelease: false
          make_latest: 'true'
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.manifest }}

      - name: 更新仓库中的 update.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MANIFEST: ${{ steps.pkg.outputs.manifest }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          Copy-Item -LiteralPath $env:MANIFEST -Destination update.json -Force
          git add update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'update.json 没有变化'
            exit 0
          }
          git commit -m "发布 v$env:VERSION：更新 update.json"
          git push origin main
